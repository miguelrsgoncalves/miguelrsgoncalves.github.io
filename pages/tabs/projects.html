<route-data
	data-title="Projects"
	data-description="All of MRSG's projects in one place"
	data-js='["/scripts/components.js","/scripts/project-manager.js"]'
	data-hide-route-title>
</route-data>

<script>
  filterInit(["startYear", "endYear", "status", "category", "tool", "tag"])
  projectManagerInit('/assets/registries/project-registry.json')
  populateProjects('card-container')
</script>

<div class="page full">

  <div class="control-group">
    <div class="control-bar">
      <div class="button left clickable" onclick="toggleControlPanel(this, 'filter')">
        <icon data-icon-name="list-filter"></icon>
        <p>Filter</p>
      </div>
      <div class="separator vertical semi thin"></div>
      <div class="button left sub-button clickable" onclick="resetFilter()"><p>Reset</p></div>

      <div class="separator vertical"></div>
      <input name="search" class="search-bar right" type="search" placeholder="Search" oninput="handleProjectSearchInput(this.value)">
    </div>

    <div id="project-filter" class="control-panel" data-panel-name="filter"></div>
  </div>

  <div id="card-container" class="projects-grid"></div>
</div>
