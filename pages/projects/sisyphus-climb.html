<route
	title="Sisyphus Climb"
	description="Fight for your right to be the true Sisyphus and carry the boulder to the top in a legendary duel!"
></route>

<div class="page narrow">
    <video autoplay controls muted loop data-src="/assets/projects/sisyphus-climb/videos/gameplay_showcase.mp4"></video>

    <div class="control-group embedded">
        <div class="control-bar embedded">
            <div class="button left" onclick="toggleControlPanel(this, 'info')">
                <icon data-id="gamepad-2"></icon>
                <div>Info</div>
            </div>

            <div class="separator vertical"></div>

            <div class="button middle" onclick="toggleControlPanel(this, 'controls')">
                <icon data-id="gamepad-2"></icon>
                <div>Controls</div>
            </div>
        
            <div class="separator vertical"></div>
            
            <div class="button middle" onclick="toggleControlPanel(this, 'how-to-play')">
                <div>How to Play</div>
                <icon data-id="book-text"></icon>
            </div>

            <div class="separator vertical"></div>
            
            <div class="button right" onclick="toggleControlPanel(this, 'links-and-downloads')">
                <div>Links & Downloads</div>
                <icon data-id="external-link"></icon>
            </div>
        </div>

        <div class="control-panel embedded" data-id="info">

        </div>

        <div class="control-panel embedded" data-id="controls">
            <div class="game-controls">
                <div class="title">Move</div>

                <div class="group">
                    <div class="entry">
                        <div class="control">WASD</div>
                    </div>
                </div>

                <div class="title">Actions</div>

                <div class="group">
                    <div class="entry">
                        <div class="name">Push</div>
                        <div class="control">F</div>
                    </div>

                    <div class="entry">
                        <div class="name">Push Boulder</div>
                        <div class="control">E</div>
                    </div>

                    <div class="entry">
                        <div class="name">Jump</div>
                        <div class="control">Space</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="control-panel embedded" data-id="how-to-play">

        </div>

        <div class="control-panel embedded" data-id="links-and-downloads">
            <div class="item-tree-card">
                <div class="group">
                    <div class="header">
                        <icon data-id="download"></icon>
                        <span>Downloads</span>
                    </div>

                    <div class="items">
                        <a class="item" href="https://kyleagius.itch.io/chat95" target="_blank">
                            <icon data-id="monitor"></icon>
                            <div class="data">
                                <div class="title">Windows</div>
                                <div class="info">
                                    <div>ZIP archive</div>
                                    <div class="separator vertical thin semi"></div>
                                    <div>55 MB</div>
                                </div>
                            </div>
                            <icon class="action-icon" data-id="download"></icon>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="control-panel embedded" data-id="download">
            <a href="/assets/projects/sisyphus-climb/builds/sysiphus_climb.zip" download>
                <icon data-id="download"></icon> Windows
            </a>
        </div>
    </div>

    <div class="credits">
        <div class="title">Credits</div>

        <div class="subtitle">Members</div>
        
        <div class="entry">
            <div class="name">MRSG</div>
        </div>
        <div class="entry-info">
            <a href="/about" target="_blank">About</a>
        </div>
    </div>
</div>
