<route
	title="Projects"
	description="All of MRSG's projects in one place"
	hide-title
></route>

<script>
    filterInit(["startYear", "endYear", "status", "category", "tool", "tag"])
    projectManagerInit('/assets/registries/project-registry.json')
    populateProjects('project-container')
</script>

<div class="page full">
    <div class="control-group">
        <div class="control-bar">
            <div class="button left clickable" onclick="toggleControlPanel(this, 'filter')">
                <icon data-id="list-filter"></icon>
                <div>Filter</div>
            </div>

            <div class="separator vertical semi thin"></div>

            <div class="button left sub-button clickable" onclick="resetFilter()">Reset</div>

            <div class="separator vertical"></div>

            <input name="search" class="search-bar right" type="search" placeholder="Search" oninput="handleProjectSearchInput(this.value)">
        </div>
        
        <div id="project-filter" class="control-panel" data-id="filter"></div>
    </div>

    <div id="project-container" class="projects-grid"></div>
</div>
